name: CI/CD Pipeline for Nuxt.js

# - Pull request / mọi push: build thử trên GitHub để bắt lỗi trước khi deploy.
# - Push lên master  -> deploy production  (hungphatelevator.com)
# - Push lên staging -> deploy subdomain   (staging.hungphatelevator.com)
# Server chỉ được deploy khi bước build trên GitHub đã thành công.

on:
  push:
    branches: [master, staging]
  pull_request:
    branches: [master, staging]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: yarn

      - name: Install dependencies
        run: yarn install --frozen-lockfile

      - name: Build
        run: yarn build

  deploy-production:
    needs: build
    if: github.event_name == 'push' && github.ref == 'refs/heads/master'
    runs-on: ubuntu-latest
    concurrency:
      group: deploy-production
      cancel-in-progress: false
    steps:
      - name: Deploy to server
        uses: appleboy/ssh-action@v1.2.0
        with:
          host: ${{ secrets.SERVER_HOST }}
          username: ${{ secrets.SERVER_USER }}
          password: ${{ secrets.SSH_PASSWORD }}
          key: ${{ secrets.SSH_PRIVATE_KEY }}
          command_timeout: 20m
          script: |
            set -e
            cd "${{ secrets.SERVER_PATH }}"
            git fetch origin master
            git checkout -q master
            git merge --ff-only origin/master
            bash scripts/deploy.sh master elevator "${{ vars.PROD_PORT || '3000' }}"

  deploy-staging:
    needs: build
    if: github.event_name == 'push' && github.ref == 'refs/heads/staging'
    runs-on: ubuntu-latest
    concurrency:
      group: deploy-staging
      cancel-in-progress: true
    steps:
      - name: Deploy to staging subdomain
        uses: appleboy/ssh-action@v1.2.0
        with:
          host: ${{ secrets.SERVER_HOST }}
          username: ${{ secrets.SERVER_USER }}
          password: ${{ secrets.SSH_PASSWORD }}
          key: ${{ secrets.SSH_PRIVATE_KEY }}
          command_timeout: 20m
          script: |
            set -e
            cd "${{ secrets.STAGING_PATH }}"
            git fetch origin staging
            git checkout -q staging
            git merge --ff-only origin/staging
            bash scripts/deploy.sh staging elevator-staging "${{ vars.STAGING_PORT || '3001' }}"
