# /etc/nginx/sites-available/staging.hungphatelevator.com
# Reverse proxy subdomain staging -> Nuxt chạy ở 127.0.0.1:3001.
# Sau khi bật site, chạy certbot để thêm HTTPS:
#   sudo certbot --nginx -d staging.hungphatelevator.com

server {
    listen 80;
    listen [::]:80;
    server_name staging.hungphatelevator.com;

    # Không cho Google index bản staging (tránh trùng nội dung với site chính)
    add_header X-Robots-Tag "noindex, nofollow" always;

    # Chặn người ngoài xem bản thử nghiệm. Tạo file mật khẩu:
    #   sudo htpasswd -c /etc/nginx/.htpasswd-staging hungphat
    auth_basic "Staging";
    auth_basic_user_file /etc/nginx/.htpasswd-staging;

    client_max_body_size 10m;

    gzip on;
    gzip_types text/css application/javascript application/json image/svg+xml;

    # File JS/CSS đã build có hash trong tên -> cache lâu dài
    location /_nuxt/ {
        proxy_pass http://127.0.0.1:3001;
        proxy_set_header Host $host;
        expires 30d;
        add_header Cache-Control "public, immutable";
        add_header X-Robots-Tag "noindex, nofollow" always;
    }

    location / {
        proxy_pass http://127.0.0.1:3001;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 60s;
    }
}
